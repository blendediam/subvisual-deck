<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subvisual — Build what comes next</title>
<meta name="description" content="Senior product, design and engineering for fintech, crypto and complex software. Selected Subvisual work with Remote, Qonto, Tesser, Utrust and Coverflex.">
<meta name="theme-color" content="#f7f7f8">
<link rel="icon" href="media/subvisual-icon.png" type="image/png">
<style>
  @font-face{font-family:'Fraunces';font-style:normal;font-weight:400;font-display:swap;src:url('media/fonts/fraunces-latin-regular.woff2') format('woff2')}
  @font-face{font-family:'Inter';font-style:normal;font-weight:400 600;font-display:swap;src:url('media/fonts/inter-latin-variable.woff2') format('woff2')}
  /* =========================================================================
     PALETTE — this is the theme. Replace these values to re-skin the whole deck.
     The names are roles, not colours, so the rest of the CSS never changes:
       --bg / --bg-2   stage background (darkest -> slightly lighter)
       --ink           primary text
       --accent        the ONE signature colour (headings' emphasis, active dot)
       --accent-soft   hover state of the accent
       --secondary     a warm/cool counterpart used sparingly
       --muted         secondary text
       --line / --card hairlines and faint surfaces
     ========================================================================= */
  :root{
    --bg:#f7f7f8;
    --bg-2:#ffffff;
    --ink:#403f4c;
    --accent:#045cfc;
    --accent-soft:#2421ab;
    --secondary:#a4b9e5;
    --muted:#717087;
    --line:rgba(64,63,76,0.17);
    --card:rgba(255,255,255,0.55);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    overflow:hidden;
    overscroll-behavior:none;              /* no pull-to-refresh / horizontal history-swipe on mobile */
    -webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased;
  }
  /* ambient warmth so the stage isn't flat — tinted by accent + secondary */
  #stage::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(1100px 700px at 78% -8%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 60%),
      radial-gradient(900px 600px at 8% 108%, color-mix(in srgb, var(--secondary) 10%, transparent), transparent 60%);
  }

  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .slide{
    position:absolute;inset:0;display:none;
    flex-direction:column;justify-content:safe center;
    padding:clamp(28px,5vw,84px);
    z-index:1;
    overflow-y:auto;                       /* a slide taller than the screen scrolls instead of clipping */
  }
  .slide.active{display:flex;animation:rise .5s cubic-bezier(.22,.9,.3,1)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.slide.active{animation:none}}

  .eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.28em;
    text-transform:uppercase;color:var(--accent);margin-bottom:22px;
  }
  h1{font-family:'Fraunces',serif;font-weight:900;line-height:.92;letter-spacing:-.01em}
  h2{font-family:'Fraunces',serif;font-weight:600;line-height:1.0}
  em{font-style:italic;color:var(--accent)}
  /* Big display type: line-height ~1 keeps descenders (subscripts like H₂, and
     g/p/y tails) inside the box so they can't bleed into the line below;
     overflow-wrap lets a very long single word break instead of clipping. */
  .display{font-size:clamp(30px,8.5vw,140px);line-height:1.0;overflow-wrap:break-word}

  /* ---------- Cover ---------- */
  #cover h1{margin:0;padding-bottom:.06em}
  /* margin scales with the type so the gap never closes up on big titles */
  #cover .sub{max-width:660px;margin-top:clamp(28px,3vw,46px);font-size:clamp(16px,1.5vw,20px);color:var(--muted);line-height:1.6}
  #cover .by{margin-top:40px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink)}
  #cover .by b{color:var(--accent);font-weight:500}
  /* optional brand logo (DECK.meta.logo) on the cover + closing */
  .brand-logo{align-self:flex-start;height:clamp(26px,3vw,40px);width:auto;margin-bottom:30px}
  .closing .brand-logo{margin-bottom:0;margin-top:38px;height:clamp(24px,2.6vw,34px);opacity:.92}

  /* ---------- Agenda ---------- */
  .agenda h2{font-size:clamp(30px,4vw,46px);margin-bottom:30px}
  .index{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;max-width:1100px}
  .idx{
    text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;color:var(--ink);cursor:pointer;display:flex;gap:16px;align-items:baseline;
    transition:border-color .18s,background .18s,transform .18s;font:inherit;
  }
  .idx:hover,.idx:focus-visible{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);transform:translateY(-2px);outline:none}
  .idx .n{font-family:'JetBrains Mono',monospace;color:var(--accent);font-size:13px;min-width:24px}
  .idx .t{font-size:17px;font-weight:500}

  /* ---------- Content ---------- */
  .content h2{font-size:clamp(28px,4vw,52px);margin-bottom:6px;max-width:16ch}
  .content .body{margin-top:26px;max-width:900px;display:flex;flex-direction:column;gap:18px}
  .content .body p{font-size:clamp(17px,1.7vw,22px);line-height:1.6;color:var(--ink)}
  .content .body p.lead{font-size:clamp(20px,2.2vw,30px);font-family:'Fraunces',serif;line-height:1.35;color:var(--ink)}
  .content .body ul{list-style:none;display:flex;flex-direction:column;gap:12px}
  .content .body li{position:relative;padding-left:28px;font-size:clamp(16px,1.6vw,20px);line-height:1.5;color:var(--ink)}
  .content .body li::before{content:"";position:absolute;left:2px;top:.62em;width:8px;height:8px;border-radius:2px;background:var(--accent)}
  .content .body b{color:var(--accent);font-weight:600}

  /* ---------- Media (video / image / embed / file) ---------- */
  /* extra bottom room so the note never sits under the nav pills */
  .media{padding:clamp(22px,3.5vw,52px);padding-bottom:84px}
  .media .topline{display:flex;align-items:baseline;gap:20px;margin-bottom:14px;flex-wrap:wrap}
  .media .segn{font-family:'JetBrains Mono',monospace;color:var(--accent);font-size:14px;letter-spacing:.12em}
  .media h2{font-size:clamp(26px,3.6vw,46px)}
  /* the frame is just a centering box; the child sizes itself */
  .mediaframe{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
  /* replaced elements keep their own aspect ratio, fit the box, no bars, no crop */
  .mediaframe video,.mediaframe img{
    max-width:min(1500px,100%);max-height:100%;width:auto;height:auto;
    background:#000;border:1px solid var(--line);border-radius:18px;display:none;
  }
  .mediaframe iframe{
    width:min(1500px,100%);max-height:100%;aspect-ratio:16/9;
    border:1px solid var(--line);border-radius:18px;display:none;
  }
  .filecard{
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    width:min(680px,100%);aspect-ratio:16/9;text-decoration:none;color:var(--ink);
    border:1px solid var(--line);border-radius:18px;background:var(--bg-2);transition:.18s;padding:30px;text-align:center;
  }
  .filecard:hover{border-color:var(--accent)}
  .filecard .fi{font-size:44px;opacity:.7}
  .filecard .fn{font-family:'JetBrains Mono',monospace;font-size:14px;word-break:break-all}
  .filecard .fd{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
  .placeholder{
    text-align:center;color:var(--muted);
    width:min(1500px,100%);aspect-ratio:16/9;
    border:1px dashed var(--line);border-radius:18px;
    background:linear-gradient(180deg,var(--bg-2),var(--bg));
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;
  }
  .placeholder .icon{font-size:40px;margin-bottom:12px;opacity:.5}
  .placeholder .load{
    margin-top:18px;display:inline-flex;align-items:center;gap:9px;cursor:pointer;
    font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--bg);background:var(--accent);border:none;border-radius:999px;padding:11px 20px;transition:.18s;
  }
  .placeholder .load:hover{background:var(--accent-soft)}
  .placeholder input[type=file]{display:none}
  .media .note{margin-top:16px;font-size:15px;color:var(--muted);line-height:1.5;max-width:900px}
  .media .note b{color:var(--ink);font-weight:500}
  .media .caption{margin-top:8px;font-size:14px;color:var(--muted);font-style:italic}

  /* ---------- Statement ---------- */
  .statement{align-items:flex-start}
  .statement h1{font-size:clamp(38px,7vw,104px);line-height:1.02;padding-bottom:.04em}
  .statement .sub{margin-top:clamp(20px,2.4vw,34px);color:var(--muted);font-size:clamp(16px,1.6vw,22px);max-width:640px;line-height:1.5}

  /* ---------- Closing ---------- */
  .closing{align-items:flex-start}
  .closing h1{font-size:clamp(40px,7vw,96px);line-height:1.02}
  .closing .sub{margin-top:clamp(20px,2.4vw,34px);color:var(--muted);font-size:clamp(16px,1.6vw,20px);max-width:560px;line-height:1.6}

  /* ---------- Socials (closing slide, from DECK.meta.socials) ---------- */
  .socials{display:flex;flex-wrap:wrap;gap:10px;margin-top:clamp(24px,3vw,40px)}
  .social{
    display:inline-flex;align-items:center;gap:9px;padding:9px 16px;
    border:1px solid var(--line);border-radius:999px;background:var(--card);
    color:var(--ink);text-decoration:none;transition:border-color .18s,color .18s;
    font-family:'JetBrains Mono',monospace;font-size:13px;
  }
  .social:hover,.social:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
  .social svg{width:15px;height:15px;flex:none}

  /* ---------- Chrome: progress + controls ---------- */
  #dots{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10}
  .dot{width:8px;height:8px;border-radius:50%;background:color-mix(in srgb,var(--ink) 22%,transparent);border:none;cursor:pointer;padding:0;transition:.2s}
  .dot:hover{background:var(--ink)}
  .dot.on{background:var(--accent);width:22px;border-radius:6px}
  .nav{position:fixed;bottom:16px;z-index:10;background:color-mix(in srgb,var(--bg) 60%,transparent);border:1px solid var(--line);color:var(--ink);
       height:42px;border-radius:21px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:9px;padding:0 16px;
       max-width:40vw;backdrop-filter:blur(4px)}
  .nav:hover{border-color:var(--accent);color:var(--accent)}
  .nav:disabled{opacity:.35;cursor:default;pointer-events:none}
  .nav .arw{font-size:19px;line-height:1;flex:none}
  .nav .lbl{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav .lbl:empty{display:none}
  #prev{left:20px}#next{right:20px}
  #counter{position:fixed;top:20px;left:20px;z-index:10;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:.12em}
  #counter b{color:var(--accent)}

  @media (max-width:640px){
    .display{font-size:clamp(28px,7.5vw,44px)}
    .slide{padding-bottom:84px}           /* keep scrolled content clear of the bottom nav/dots */
  }

  /* Subvisual editorial system. The navigation engine is the bundled template. */
  :root{--serif:'Fraunces',Georgia,serif;--sans:'Inter',Arial,sans-serif;--dark:#2421ab}
  body{font-family:var(--sans)}
  body::before,body::after{content:"";position:fixed;left:0;right:0;background:var(--bg);z-index:9;pointer-events:none}
  body::before{top:0;height:66px}body::after{bottom:0;height:70px}
  #stage::before{background:none}
  .slide{padding:88px clamp(28px,5.6vw,100px) 86px;justify-content:safe center}
  h1,h2{font-family:var(--serif);font-weight:400;letter-spacing:-.045em;font-optical-sizing:auto}
  h2{font-size:clamp(36px,4.5vw,72px);line-height:1.06;max-width:22ch}
  em{font-style:normal}
  .eyebrow{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.18em;margin-bottom:23px}
  .lede{font-size:clamp(16px,1.45vw,22px);line-height:1.5;color:var(--muted);max-width:54ch;margin-top:24px}
  .fine{font-size:12px;line-height:1.5;color:var(--muted)}
  .deck-brand{position:fixed;top:27px;left:clamp(28px,5.6vw,100px);z-index:12;width:105px;height:auto}
  #counter{left:auto;right:clamp(28px,5.6vw,100px);top:29px;font-size:11px;letter-spacing:.08em}
  #counter b{color:var(--ink)}
  #dots{bottom:27px;gap:7px}.dot{width:6px;height:6px}.dot.on{width:21px}
  .dot:focus-visible,.nav:focus-visible,.jump:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:5px}
  .nav{bottom:16px;background:var(--bg);height:38px;border-radius:99px;padding:0 15px;max-width:25vw}
  .nav .lbl{font-size:12px}.nav .arw{font-size:23px}
  #prev{left:clamp(24px,3vw,48px)}#next{right:clamp(24px,3vw,48px)}
  .deck-rule{position:fixed;left:clamp(28px,5.6vw,100px);right:clamp(28px,5.6vw,100px);bottom:70px;border-top:1px solid var(--line);z-index:11;pointer-events:none}
  #cover{padding-right:47%;min-height:0}
  #cover .brand-logo,#cover .by{display:none}
  #cover h1{font-size:clamp(48px,6.7vw,108px);font-weight:400;line-height:1.02;letter-spacing:-.055em;position:relative;z-index:2}
  #cover .sub{font-size:clamp(16px,1.5vw,22px);line-height:1.5;max-width:31ch;color:var(--ink);margin-top:30px}
  .cover-art{position:absolute;right:5.6vw;top:100px;bottom:108px;width:35%;border-radius:3px;background:var(--dark);overflow:hidden;display:flex;align-items:center;justify-content:center}
  .cover-art{isolation:isolate;background:radial-gradient(ellipse at 60% 40%,#3732ba 0%,var(--dark) 70%)}
  .orbit-stage{position:absolute;inset:24px 12px 80px;display:grid;place-items:center;pointer-events:none}
  .orbit-object{position:absolute;inset:0;margin-inline:auto;width:100%;height:100%;max-width:520px;transform:perspective(850px) translate3d(var(--orbit-x,0px),var(--orbit-y,0px),0) rotateX(var(--orbit-rx,0deg)) rotateY(var(--orbit-ry,0deg));transition:transform 950ms cubic-bezier(.16,1,.3,1)}
  .cover-art .orbit-svg{display:block;width:100%;height:100%;overflow:visible}
  .orbit-spin,.orbit-breathe,.orbit-satellite{transform-box:view-box;transform-origin:0px 0px;animation-play-state:paused}
  .orbit-spin{animation:orbit-turn 72s linear infinite paused}
  .orbit-breathe{animation:orbit-breathe 14s ease-in-out infinite alternate paused}
  .orbit-satellite{animation:orbit-turn 28s linear infinite paused}
  .orbit-satellite.secondary{animation-duration:41s;animation-direction:reverse}
  #cover.active:not(.motion-suspended) :is(.orbit-spin,.orbit-breathe,.orbit-satellite){animation-play-state:running}
  @keyframes orbit-turn{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @keyframes orbit-breathe{from{transform:scale(.96)}to{transform:scale(1.025)}}
  .cover-art .art-label{position:absolute;bottom:24px;left:27px;z-index:2;color:rgba(255,255,255,.75);font-size:10px;letter-spacing:.15em;text-transform:uppercase;line-height:1.7}
  .cover-art img{position:absolute;top:26px;left:26px;z-index:2;width:34px;height:auto}
  @media(prefers-reduced-motion:reduce){.cover-art :is(.orbit-spin,.orbit-breathe,.orbit-satellite){animation:none}.cover-art .orbit-object{transform:none;transition:none}}
  .cover-foot{margin-top:36px;font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:7vw;align-items:center}
  .text-list{display:flex;flex-direction:column;gap:0}
  .list-row{padding:23px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:32px 1fr;gap:15px}
  .list-row .n{font:11px var(--sans);color:var(--accent);padding-top:5px}
  .list-row h3{font-size:18px;font-weight:500;letter-spacing:-.025em;line-height:1.25}
  .list-row p{font-size:15px;color:var(--muted);line-height:1.5;margin-top:9px;max-width:47ch}
  .section-links{display:flex;gap:18px;margin-top:34px;flex-wrap:wrap}
  .jump{border:0;background:none;font:12px var(--sans);color:var(--accent);cursor:pointer;border-bottom:1px solid rgba(4,92,252,.3);padding:0 0 7px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:35px 48px;margin-top:40px}
  .stat{border-top:1px solid var(--line);padding-top:17px}
  .stat strong{font:400 clamp(46px,5.6vw,88px)/1.08 var(--serif);letter-spacing:-.04em;color:var(--accent);display:block}
  .stat p{font-size:14px;line-height:1.4;max-width:22ch;margin-top:9px}
  .proof-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:8vw;align-items:center}
  .portfolio-logos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px 24px;max-width:324px;list-style:none;margin:28px 0 0;padding:0}
  .portfolio-logos li{display:flex;align-items:center;min-width:0;min-height:25px}
  /* Company marks are supporting labels, below the slide's editorial hierarchy. */
  .client-logo{display:block;width:76px;height:18px;max-width:100%;object-fit:contain;object-position:left center}
  .client-logo.remote{width:78px;height:25px}
  .client-logo.qonto{width:64px;height:18px}
  .client-logo.tesser{width:68px;height:17px}
  .client-logo.coverflex{width:92px;height:18px}
  .case-name{min-height:25px}
  .case-visual.qonto{background:#efece7;padding:0 0 45px}
  .case-visual.qonto>img{width:100%;height:100%;max-height:none;object-fit:cover;object-position:center 63%;align-self:stretch}
  .case-visual.qonto .visual-caption{color:#5c5854}
  .ownership-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin-top:43px}
  .ownership-col{border-top:1px solid var(--line);padding-top:19px;min-width:0}
  .ownership-col .num{font-size:11px;color:var(--accent);margin-bottom:28px}
  .ownership-col h3{font:400 clamp(26px,2.5vw,38px)/1.12 var(--serif);letter-spacing:-.03em;max-width:13ch}
  .ownership-col p{font-size:15px;line-height:1.55;color:var(--muted);max-width:30ch;margin-top:17px}
  .ribbon{margin-top:36px;padding:18px 22px;border-left:2px solid var(--accent);background:#ededf1;display:flex;gap:24px;align-items:baseline}
  .ribbon b{font-weight:500;font-size:14px;flex:none}.ribbon span{font-size:13px;line-height:1.5;color:var(--muted)}
  .engagements{margin-top:30px;display:flex;flex-direction:column}
  .engagement{display:grid;grid-template-columns:52px .9fr 1fr;gap:28px;padding:25px 0;border-top:1px solid var(--line);align-items:baseline}
  .engagement .n{font:12px var(--sans);color:var(--accent)}
  .engagement h3{font:400 clamp(24px,2.5vw,36px)/1.15 var(--serif);letter-spacing:-.03em}
  .engagement p{font-size:15px;line-height:1.5;color:var(--muted);max-width:49ch}
  .case-layout{display:grid;grid-template-columns:.84fr 1.16fr;gap:5vw;align-items:center;width:100%}
  .case-copy h2{font-size:clamp(34px,3.7vw,61px);line-height:1.07;max-width:15ch}
  .case-copy .lede{font-size:15px;line-height:1.6;margin-top:22px;max-width:44ch}
  .case-name{display:flex;align-items:center;gap:11px;margin-bottom:20px;font-size:13px;font-weight:500;letter-spacing:.01em}
  .case-name .case-no{font-size:9px;color:var(--accent);border:1px solid var(--line);border-radius:99px;padding:4px 6px;font-weight:400}
  .case-detail{display:grid;grid-template-columns:80px 1fr;gap:14px;border-top:1px solid var(--line);padding-top:15px;margin-top:22px}
  .case-detail .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);padding-top:3px}
  .case-detail p{font-size:13px;line-height:1.6}
  .case-visual{position:relative;min-width:0;min-height:360px;aspect-ratio:1.1;background:#e9ecf4;border-radius:3px;padding:36px 24px 54px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .case-visual img{max-width:100%;max-height:420px;object-fit:contain;position:relative;z-index:1;display:block}
  .case-visual .visual-caption{position:absolute;bottom:17px;left:24px;right:24px;font-size:9px;letter-spacing:.03em;line-height:1.45;color:var(--muted);z-index:2}
  .case-visual.remote{background:#e4eafb}.case-visual.tesser{background:#e3e6e4}.case-visual.utrust{background:#29253d}.case-visual.coverflex{background:#eaf2eb}
  .case-visual.utrust .visual-caption{color:#c4c0d4}
  .case-visual.utrust img:first-child{width:91%;transform:translate(-3%,-6%)}
  .case-visual.utrust .secondary-image{position:absolute;width:36%;right:8%;bottom:11%;max-height:245px;filter:drop-shadow(0 12px 16px rgba(0,0,0,.2));z-index:2}
  .case-quote{margin-top:23px;font:400 23px/1.3 var(--serif);letter-spacing:-.02em;max-width:25ch}

/* =========================================================================

   nav all stay in sync automatically.

   Slide types (see references/slide-types.md for the full catalogue):
     cover      — title screen. Uses `meta`. Put one first.
     agenda     — auto-lists every slide with `agenda:true`, clickable.
     content    — heading + body (paragraphs / bullets / a lead line).
     media      — one video, image, embed URL, or downloadable file.
     statement  — one big line (a quote, a claim, a section divider).
     closing    — the sign-off / "Questions?" screen.
     custom     — your own render(el) function for bespoke interactive slides.

   Common optional fields on any slide:

const CLIENTS = {

const TRUSTED_CLIENTS = {

function clientLogo(key,brands=CLIENTS){
  const brand=brands[key];

}
function portfolioLogos(){
  return `<ul class="portfolio-logos" aria-label="Selected client portfolio">${Object.keys(CLIENTS).map(key=>`<li>${clientLogo(key)}</li>`).join("")}</ul>`;
}
function trustedByHTML(){
  const rows=[Object.keys(CLIENTS),["att","protocol-labs","uphold","brazos","orki","quill"]];
  return `<aside class="trust-panel" aria-label="Trusted by"><div class="trust-heading"><div class="eyebrow">Trusted by</div></div>${rows.map((keys,i)=>{const group=keys.map(key=>`<li>${clientLogo(key,TRUSTED_CLIENTS)}</li>`).join("");return `<div class="trust-window"><div class="trust-track"><ul class="trust-group" aria-label="${i===0?'Featured portfolio':'More trusted companies'}">${group}</ul><ul class="trust-group" aria-hidden="true">${group}</ul></div></div>`;}).join("")}</aside>`;
}
const DECK = {

    {type:"custom",label:"Ways to work",title:"Fit the work. Then shape the team.",render(s){s.innerHTML=`

      <div class="eyebrow">Supporting detail / Capabilities</div><h2>Technical depth,<br><em>applied.</em></h2><div class="appendix-grid"><article><h3>Financial infrastructure</h3><p>Payments, stablecoin rails, blockchain integrations and the systems around them.</p><div class="stack">Selected work / Tesser · Utrust</div></article><article><h3>Production systems</h3><p>Backend services, APIs, distributed systems, infrastructure and observability.</p><div class="stack">Selected work / Remote · Utrust</div></article><article><h3>Product and experience</h3><p>Discovery, product direction, user flows, interfaces and web or mobile delivery.</p><div class="stack">Selected work / Coverflex · Tesser</div></article><article><h3>Technology by context</h3><p>Elixir, TypeScript, React, React Native, Solidity and cloud infrastructure among the tools we use.</p><div class="stack">Architecture follows the product’s needs.</div></article></div>`;},sources:["pitch","product","utrust"]},

const $ = (s,el=document)=>el.querySelector(s);
const stage = $("#stage");
const slides = [];   // {el, label, onEnter, onLeave}

function el(tag, cls, html){ const n=document.createElement(tag); if(cls)n.className=cls; if(html!=null)n.innerHTML=html; return n; }
function num(i){ return String(i+1).padStart(2,"0"); }
function kindOf(src){
  if(!src) return "none";
  if(/\.(mp4|webm|ogg|mov|m4v)$/i.test(src)) return "video";
  if(/\.(png|jpe?g|gif|webp|avif|svg)$/i.test(src)) return "image";
  if(/(youtube\.com|youtu\.be|vimeo\.com|player\.)/i.test(src)) return "embed";
  if(/^https?:/i.test(src)) return "embed";
  return "file";   // any other local file — offer it as a download card
}

/* ---- Cover ---- */
function renderCover(spec){
  const m = DECK.meta;
  const s = el("div","slide"); s.id="cover";
  const title = m.titleEmphasis && m.title.includes(m.titleEmphasis)
    ? m.title.replace(m.titleEmphasis, `<em>${m.titleEmphasis}</em>`)
    : m.title;
  s.innerHTML = `
    ${m.logo?`<img class="brand-logo" src="${m.logo}" alt="${m.team||'logo'}">`:""}
    ${m.eyebrow?`<div class="eyebrow">${m.eyebrow}</div>`:""}
    <h1 class="display">${title}</h1>
    ${m.tagline?`<p class="sub">${m.tagline}</p>`:""}
    <div class="cover-foot">Fintech · Crypto · Complex software</div>
    <div class="cover-art" aria-hidden="true">
      <img src="media/subvisual-icon.png" alt="">
      <div class="orbit-stage"><div class="orbit-object"><svg class="orbit-svg" viewBox="-250 -250 500 500" fill="none" focusable="false">
        <defs><linearGradient id="orbit" x1="-190" y1="-210" x2="210" y2="200" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset=".48" stop-color="#d1d4ff"/><stop offset="1" stop-color="#8580e0"/></linearGradient></defs>
        <g class="orbit-breathe"><g class="orbit-spin"><g transform="rotate(-28)" stroke="url(#orbit)" stroke-width="1.15" opacity=".78">
          ${Array.from({length:15},(_,i)=>`<ellipse rx="${65+i*10}" ry="${205-i*4}" transform="rotate(${i*7})"/>`).join("")}
        </g></g>
        <g transform="rotate(-28) scale(.76 1)"><g class="orbit-satellite"><circle cx="0" cy="-205" r="13" fill="#d9dcff" opacity=".08"/><circle cx="0" cy="-205" r="5" fill="#fff"/></g></g>
        <g transform="rotate(48) scale(.9 .75)"><g class="orbit-satellite secondary"><circle cx="0" cy="205" r="4" fill="#c5c9ff"/></g></g></g>
      </svg></div></div>
      <div class="art-label">Build the product.<br>Grow what comes next.</div>
    </div>`;
  const art=s.querySelector('.cover-art'),object=s.querySelector('.orbit-object');
  const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
  let pointerFrame=0,pointerX=0,pointerY=0;
  const resetPointer=()=>{
    cancelAnimationFrame(pointerFrame);pointerFrame=0;
    ['--orbit-x','--orbit-y','--orbit-rx','--orbit-ry'].forEach(property=>object.style.removeProperty(property));
  };
  const updateMotion=()=>{
    s.classList.toggle('motion-suspended',document.hidden);
    if(document.hidden||reducedMotion.matches) resetPointer();
  };
  art.addEventListener('pointermove',event=>{
    if(event.pointerType==='touch'||reducedMotion.matches||document.hidden||!s.classList.contains('active')) return;
    const bounds=art.getBoundingClientRect();
    if(!bounds.width||!bounds.height) return;
    pointerX=Math.max(-1,Math.min(1,(event.clientX-bounds.left)/bounds.width*2-1));
    pointerY=Math.max(-1,Math.min(1,(event.clientY-bounds.top)/bounds.height*2-1));
    if(pointerFrame) return;
    // Ambient motion stays in CSS; pointer updates are coalesced to one frame.
    pointerFrame=requestAnimationFrame(()=>{
      pointerFrame=0;
      object.style.setProperty('--orbit-x',`${pointerX*5}px`);
      object.style.setProperty('--orbit-y',`${pointerY*5}px`);
      object.style.setProperty('--orbit-rx',`${-pointerY*6}deg`);
      object.style.setProperty('--orbit-ry',`${pointerX*8}deg`);
    });
  },{passive:true});
  art.addEventListener('pointerleave',resetPointer);
  art.addEventListener('pointercancel',resetPointer);
  document.addEventListener('visibilitychange',updateMotion);
  reducedMotion.addEventListener('change',updateMotion);
  return { el:s, label:spec.label||"Intro",onEnter:updateMotion,onLeave:resetPointer };
}

/* ---- Agenda (auto-built from slides flagged agenda:true) ---- */
function renderAgenda(spec){
  const s = el("div","slide agenda");
  s.appendChild(el("div","eyebrow",spec.eyebrow||"The run of show"));
  s.appendChild(el("h2",null,spec.title||"Agenda"));
  const grid = el("div","index");
  DECK.slides.forEach((sp,i)=>{
    if(!sp.agenda) return;
    const b = el("button","idx");
    b.innerHTML = `<span class="n">${num(agendaCount(i))}</span><span class="t">${sp.title||sp.label||sp.type}</span>`;
    b.onclick = ()=> go(i);
    grid.appendChild(b);
  });
  s.appendChild(grid);
  return { el:s, label:spec.label||"Agenda" };
}
// position of slide i among the agenda-flagged slides (1-based number shown)
function agendaCount(i){ return DECK.slides.slice(0,i+1).filter(sp=>sp.agenda).length-1; }

/* ---- Content ---- */
function bodyHTML(body){
  if(!body) return "";
  return body.map(b=>{
    if(typeof b === "string") return `<p>${b}</p>`;
    if(b.lead) return `<p class="lead">${b.lead}</p>`;
    if(b.bullets) return `<ul>${b.bullets.map(x=>`<li>${x}</li>`).join("")}</ul>`;
    return "";
  }).join("");
}
function renderContent(spec){
  const s = el("div","slide content");
  s.innerHTML = `
    ${spec.eyebrow?`<div class="eyebrow">${spec.eyebrow}</div>`:""}
    ${spec.title?`<h2>${spec.title}</h2>`:""}
    <div class="body">${bodyHTML(spec.body)}</div>`;
  return { el:s, label:spec.label||spec.title };
}

/* ---- Media: video | image | embed | file | (empty -> live load) ---- */
function renderMedia(spec, i){
  const s = el("div","slide media");
  const total = DECK.slides.filter(sp=>sp.type==="media").length;
  const pos = DECK.slides.slice(0,i+1).filter(sp=>sp.type==="media").length;
  s.innerHTML = `
    <div class="topline">
      <span class="segn">${num(pos-1)} / ${String(total).padStart(2,"0")}</span>
      <h2>${spec.title||""}</h2>
    </div>
    <div class="mediaframe">
      <video controls playsinline></video>
      <img alt="${spec.title||""}">
      <iframe allow="autoplay; fullscreen" allowfullscreen></iframe>
      <a class="filecard"><span class="fi">⭳</span><span class="fn"></span><span class="fd">Download</span></a>
      <div class="placeholder">
        <div class="icon">▶</div>
        <div>Media for “${spec.title||"this slide"}” goes here</div>
        <label class="load">Load file<input type="file"></label>
      </div>
    </div>
    ${spec.note?`<div class="note"><b>Note:</b> ${spec.note}</div>`:""}
    ${spec.caption?`<div class="caption">${spec.caption}</div>`:""}`;

  const video=$("video",s), img=$("img",s), frame=$("iframe",s), fileCard=$(".filecard",s),
        ph=$(".placeholder",s), input=$("input",s);
  const kind = spec.kind || kindOf(spec.src);

  function show(node){ [video,img,frame,fileCard,ph].forEach(n=>n.style.display="none"); if(node) node.style.display=""; }

  if(spec.src && kind==="video"){ video.src=spec.src; show(video); video.style.display="block"; }
  else if(spec.src && kind==="image"){ img.src=spec.src; show(img); img.style.display="block"; }
  else if(spec.src && kind==="embed"){ frame.src=spec.src; show(frame); frame.style.display="block"; }
  else if(spec.src && kind==="file"){
    fileCard.href=spec.src; fileCard.setAttribute("download","");
    $(".fn",fileCard).textContent = spec.src.split("/").pop();
    show(fileCard); fileCard.style.display="flex";
  } else { show(ph); ph.style.display="flex"; }

  // hint the file picker toward images if the slide is meant to hold one
  input.accept = spec.kind==="image" ? "image/*" : "video/*,image/*";
  input.onchange = e=>{
    const f=e.target.files[0]; if(!f) return;
    const url=URL.createObjectURL(f);
    if(f.type.startsWith("image/")){ img.src=url; show(img); img.style.display="block"; }
    else { video.src=url; show(video); video.style.display="block";
           if(s.classList.contains("active")){ const p=video.play(); if(p&&p.catch)p.catch(()=>{}); } }
  };

  return {
    el:s, label:spec.label||spec.title,
    onEnter:()=>{
      if(video.src && video.style.display!=="none"){
        try{ video.currentTime=0; }catch(_){}
        const p=video.play(); if(p&&p.catch) p.catch(()=>{ /* autoplay blocked — controls still work */ });
      }
    },
    onLeave:()=>{ try{ video.pause(); }catch(_){} }
  };
}

/* ---- Custom: bespoke interactive slide (see references/slide-types.md) ----
   spec.render(el) receives the slide element to populate. Optional spec.onEnter
   / spec.onLeave run on slide change. Use for things like a live calculator. */
function renderCustom(spec){
  const s = el("div","slide "+(spec.className||""));
  if(spec.id) s.id=spec.id;
  if(typeof spec.render==="function") spec.render(s);
  return { el:s, label:spec.label||spec.title||"—", onEnter:spec.onEnter, onLeave:spec.onLeave };
}

/* ---- Build the deck ---- */
const RENDERERS = { cover:renderCover, agenda:renderAgenda, content:renderContent,
                    media:renderMedia, statement:renderStatement, closing:renderClosing, custom:renderCustom };
DECK.slides.forEach((spec,i)=>{
  const fn = RENDERERS[spec.type];
  if(!fn){ console.warn("Unknown slide type:",spec.type); return; }
  const rec = fn(spec,i);
  rec.el.dataset.slideNumber=String(i+1);
  rec.el.setAttribute("role","group");
  rec.el.setAttribute("aria-label",`Slide ${i+1}: ${rec.label.replace(/<[^>]+>/g,"")}`);
  rec.el.setAttribute("aria-roledescription","slide");
  slides.push(rec);
  stage.appendChild(rec.el);
});

/* ---- Navigation ---- */
let idx = 0;
const dotsWrap = $("#dots");
slides.forEach((rec,i)=>{ const d=el("button","dot"); d.setAttribute("aria-label",`Slide ${i+1}: ${rec.label.replace(/<[^>]+>/g,"")}`);d.title=rec.label.replace(/<[^>]+>/g,"");d.onclick=()=>go(i);dotsWrap.appendChild(d); });
$("#total").textContent = String(slides.length).padStart(2,"0");

function go(n){
  n=Math.max(0,Math.min(slides.length-1,n));
  if(n===idx && slides[idx].el.classList.contains("active")) return;
  const prev = slides[idx];
  if(prev && prev.onLeave) prev.onLeave();
  if(prev) prev.el.classList.remove("active");
  idx=n;
  const cur = slides[idx];
  cur.el.classList.add("active");
  cur.el.scrollTop=0;
  if(cur.onEnter) cur.onEnter();
  dotsWrap.querySelectorAll(".dot").forEach((d,i)=>{d.classList.toggle("on",i===idx);d.setAttribute("aria-current",i===idx?"step":"false");});
  $("#cur").textContent = num(idx);
  const prevBtn=$("#prev"), nextBtn=$("#next");
  $(".lbl",prevBtn).textContent = idx>0 ? (slides[idx-1].label||"") : "";
  $(".lbl",nextBtn).textContent = idx<slides.length-1 ? (slides[idx+1].label||"") : "";
  prevBtn.disabled = idx===0;
  nextBtn.disabled = idx===slides.length-1;
  history.replaceState(null,"",`#slide-${idx+1}`);
}
$("#next").onclick=()=>go(idx+1);
$("#prev").onclick=()=>go(idx-1);
document.addEventListener("keydown",e=>{
  // If a video is focused, let arrows/space scrub it instead of changing slides.
  const ae=document.activeElement;
  if(ae && ae.tagName==="VIDEO" && ["ArrowLeft","ArrowRight"," "].includes(e.key)) return;
  if(ae && ["BUTTON","A","INPUT","TEXTAREA","SELECT"].includes(ae.tagName) && e.key===" ") return;
  if(["ArrowRight","PageDown"].includes(e.key)||e.key===" "){ e.preventDefault(); go(idx+1); }
  else if(["ArrowLeft","PageUp"].includes(e.key)){ e.preventDefault(); go(idx-1); }
  else if(e.key==="Home") go(0);
  else if(e.key==="End") go(slides.length-1);
});

/* ---- Touch: a horizontal swipe changes slides; vertical drags still scroll a tall slide ---- */
let _tx=0,_ty=0,_tt=0;
stage.addEventListener("touchstart",e=>{const t=e.changedTouches[0];_tx=t.clientX;_ty=t.clientY;_tt=Date.now();},{passive:true});
stage.addEventListener("touchend",e=>{
  if(e.target.closest("video")) return;             // don't hijack in-video scrubbing
  const t=e.changedTouches[0], dx=t.clientX-_tx, dy=t.clientY-_ty;
  // quick, mostly-horizontal flick → navigate; everything else falls through to native scroll
  if(Date.now()-_tt<600 && Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)*1.6) go(dx<0?idx+1:idx-1);
},{passive:true});

stage.querySelectorAll("[data-go]").forEach(button=>button.addEventListener("click",()=>go(Number(button.dataset.go))));
const initialSlide=location.hash.match(/^#slide-(\d+)$/);
go(initialSlide?Number(initialSlide[1])-1:0);
